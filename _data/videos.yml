# Clips on the Video section of Photos & Video, oldest first.
#
# Ordered by when the ride happened, which is not the same as the file dates:
# the Cycle Jamaica clips were exported on 22 April for a trip ridden 10-12
# April, and the Horsey Hundred clip on 26 May for a ride on 23 May. Ordering by
# export date put the Jamaica trip after a ride that in fact followed it.
#
# `created` is the ride date where one is known and the export date otherwise.
# It is not shown on the page; it only sets this order.
#
# `title` is taken from what each clip says on screen or from the ride it is
# plainly of — none of it is invented. Rename freely; it is only a label.
#
# `duration` is ISO 8601, measured off the shipped file with ffprobe, and feeds
# the VideoObject markup in _includes/structured-data.html — a self-hosted mp4
# tells a search engine nothing on its own, so the markup is the only way these
# clips are findable. Measure a new one rather than estimating:
#   ffprobe -v error -show_entries format=duration -of csv=p=0 videos/<slug>.mp4
#
# `description` is optional and also feeds that markup. Without one the title is
# used, which is thin — a sentence saying what is actually in the clip is worth
# adding whenever someone knows.
#
# Removed 2026-09-28: a clip listed as "Home ride" (exported 25 April) turned
# out to be a second edit of the ride already here as "Building toward the
# Horsey 100" — same footage, same on-screen captions, and the Strava card
# inside it reads "Building toward the Horsey 100" and the same 856 ft of
# gain. It only differed in how it ended. Kept the one whose title matches the
# ride and whose outro carries the logo and Strava link. Check a new export
# against this list before adding it; two cuts of one ride read as two rides.
#
# Sources are 1080x1920 masters; what ships is 540x960 at CRF 27, which is
# indistinguishable at the size these play in the grid. Masters are outside the
# repo — re-encode from those rather than from these if a bigger version is ever
# needed.

