# Clips on the Video section of Photos & Video, oldest first.
#
# Ordered by when the ride happened, which is not the same as the file dates:
# the Cycle Jamaica clips were exported on 22 April for a trip ridden 10-12
# April, and the Horsey Hundred clip on 26 May for a ride on 23 May. Ordering by
# export date put the Jamaica trip after a ride that in fact followed it.
#
# `created` is the ride date where one is known and the export date otherwise.
# It is not shown on the page; it only sets this order.
#
# `title` is taken from what each clip says on screen or from the ride it is
# plainly of — none of it is invented. Rename freely; it is only a label.
#
# Sources are 1080x1920 masters; what ships is 540x960 at CRF 27, which is
# indistinguishable at the size these play in the grid. Masters are outside the
# repo — re-encode from those rather than from these if a bigger version is ever
# needed.

