# Clips on the Video section of Photos & Video, oldest first.
#
# Ordered by when the ride happened, which is not the same as the file dates:
# the Cycle Jamaica clips were exported on 22 April for a trip ridden 10-12
# April, and the Horsey Hundred clip on 26 May for a ride on 23 May. Ordering by
# export date put the Jamaica trip after a ride that in fact followed it.
#
# `created` is the ride date where one is known and the export date otherwise.
# It is not shown on the page; it only sets this order.
#
# `title` is taken from what each clip says on screen or from the ride it is
# plainly of — none of it is invented. Rename freely; it is only a label.
#
# `duration` is ISO 8601, measured off the shipped file with ffprobe, and feeds
# the VideoObject markup in _includes/structured-data.html — a self-hosted mp4
# tells a search engine nothing on its own, so the markup is the only way these
# clips are findable. Measure a new one rather than estimating:
#   ffprobe -v error -show_entries format=duration -of csv=p=0 videos/<slug>.mp4
#
# `creator` is optional and controls the authorship claim in that markup.
# Leave it out and the clip is credited to Anthony, which is the common case.
# Set it to a blank string for a clip he did not make: the creator is then
# omitted entirely rather than asserting someone else. Same convention as the
# links in _config.yml - blank removes the claim instead of inventing one.
#
# This matters more than it looks. The VideoObject markup is a statement to
# search engines about who made the thing, so defaulting every clip to Anthony
# would have published a false authorship claim on footage the Cycle Jamaica
# group shot and released.
#
# `description` is optional and also feeds that markup. Without one the title is
# used, which is thin — a sentence saying what is actually in the clip is worth
# adding whenever someone knows.
#
# Removed 2026-09-28: a clip listed as "Home ride" (exported 25 April) turned
# out to be a second edit of the ride already here as "Building toward the
# Horsey 100" — same footage, same on-screen captions, and the Strava card
# inside it reads "Building toward the Horsey 100" and the same 856 ft of
# gain. It only differed in how it ended. Kept the one whose title matches the
# ride and whose outro carries the logo and Strava link. Check a new export
# against this list before adding it; two cuts of one ride read as two rides.
#
# Sources are 1080x1920 masters; what ships is 540x960 at CRF 27, which is
# indistinguishable at the size these play in the grid. Masters are outside the
# repo — re-encode from those rather than from these if a bigger version is ever
# needed.

- slug: cycle-jamaica-day-1
  title: "Cycle Jamaica — Day 1"
  creator: ""   # made by the Cycle Jamaica group, not by Anthony
  description: >-
    Day one of the Cycle Jamaica trip: an early start at the hotel, a police-escorted convoy heading out, and a visit to the Runaway Bay Basic School to meet the children. Captioned on screen as “early mornings”, “getting the day started right” and “taking off with the convoy”, and closing on a thank you to Cycle Jamaica for the rides of a lifetime.
  created: 2026-04-10
  duration: PT1M8S

- slug: cycle-jamaica-day-2
  title: "Cycle Jamaica — Day 2"
  creator: ""   # made by the Cycle Jamaica group, not by Anthony
  description: >-
    Day two of Cycle Jamaica, the One Love Century. Rolling out with the group, riding the coast road, and a rest stop given over to refreshments, music and dancing — community time, Jamaica-style. The on-screen text closes on “challenging together, finishing together, one love”.
  created: 2026-04-11
  duration: PT1M39S

- slug: started-here-finished
  title: "Started here. Finished."
  creator: ""   # unconfirmed whether Anthony or the group made this one
  description: >-
    A Cycle Jamaica ride compressed into four on-screen lines — “started here”, “still showing up”, “putting in the miles”, “finished” — running from the riders gathered before dawn to Anthony wearing the finisher’s medal.
  created: 2026-04-18
  duration: PT17S


- slug: building-toward-horsey
  title: "Building toward the Horsey 100"
  description: >-
    A training ride in Caldwell County, Kentucky, building toward the Horsey Hundred: 10.63 miles, 856 feet of climbing, 55:58 at an average of 11.4 mi/h. The on-screen text runs “went for a ride today, man that felt good”, “pedaled it all away”, “my legs are tired, but it is worth it” and “a little sweat, a little effort”.
  created: 2026-04-26
  duration: PT1M0S

- slug: horsey-hundred-ride
  title: "Horsey Hundred"
  description: >-
    The Horsey Hundred in Scott County, Kentucky, ridden in the rain — 36.78 miles and 2,300 feet of climbing, logged on Strava as a bad day on the bike but still miles. The on-screen text moves from “some rides are about speed” through “sometimes the weather takes control” and “some are about surviving the route” to “still miles, still forward”.
  created: 2026-05-23
  duration: PT1M6S

- slug: weather-takes-control
  title: "When the weather takes control"
  description: >-
    Heavy rain seen from the porch, cut against photographs from recent rides, and closing on the DaPenguin card and its line: ride, finish, repeat.
  created: 2026-05-30
  duration: PT30S

- slug: going-out
  title: "Going out"
  description: >-
    A training ride told in title cards — “going out”, “roads ahead”, “unbothered”, “training” — over open Kentucky road, a close-up of the drivetrain, and the DaPenguin mark.
  created: 2026-06-08
  duration: PT38S
