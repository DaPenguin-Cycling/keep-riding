# Rides shown on event.html, and the "Latest ride" block on the home page.
#
# `completed` is newest first — the home page takes the first entry.
# `upcoming` being empty is a valid state: the Rides page then says
# "Nothing on the board right now. That won't last." rather than inventing an
# event to fill the space. Add an entry with the same fields to list one.
#
# `image` is optional. Leave it out and the ride renders as a text card; add a
# filename from images/ plus `image_alt` and a photo appears on that card. Only
# add one when it is genuinely from that ride.
#
# `strava` is optional. Give it `distance`, `elevation` and `time` and the card
# shows them as a stat row. Add `url` and that row links to the activity — only
# do that for an activity that is public, or the link 404s for visitors.
#
# `image_position` sets the CSS object-position for the card's 3:2 crop. It
# defaults to "center 25%", which suits landscape shots. A portrait photo only
# shows about half its height in that slot, so use "center top" to keep a face
# in frame.

upcoming:
  - name: Cameron Ponder Memorial Ride
    meta: "October 3, 2026 • Elizabethtown, Kentucky"
    # No `body` yet: distance/route and Anthony's own note on this one are not
    # known, and the card renders fine without them. Add lines here when he has
    # something to say about it.
    body: []

completed:
  - name: Limestone Cycling Tour
    meta: "September 2026 • 28 miles"
    # Home page uses this shorter note; the Rides page uses `body` below.
    home_body:
      - Another one in the books.
      - Good ride. Good people. Bike did what it was supposed to do.
      - I'll take it.
    body:
      - Finished.
      - Legs worked. Bike worked. That's generally the arrangement I'm looking for.
    image: IMG_0040.jpeg
    image_alt: Anthony Brown riding through the finish arch at the Limestone Cycling Tour
    image_w: 607
    image_h: 640

  - name: Horsey Hundred
    meta: "May 23, 2026 • Georgetown, Kentucky"
    # He bonked and did not finish this one. The closing line is his own Strava
    # caption for the ride, verbatim, and 36.78 mi is the distance from that
    # same activity — both read off the Strava card shown at 0:56 in
    # videos/horsey-hundred-ride.mp4. The ride is logged there as a Morning
    # Ride in Scott County, Kentucky: 36.78 mi, 2,300 ft, 3:55:00, 165 W avg.
    body:
      - One of the Kentucky Cycling Challenge rides and one I look forward to.
      - Third year doing this series. Still not tired of it.
      - Bonked and called it at 36.78 miles this year.
      - Bad day on the bike, but still miles.
    strava:
      # url: needs the activity id from the ride's Strava page
      distance: "36.78 mi"
      elevation: "2,300 ft"
      time: "3:55:00"
    # The jersey in this shot reads KENTUCKY CYCLING CHALLENGE 2025 — that is
    # last year's kit. The photo is from the 2026 ride, confirmed by Melanie.
    image: horsey-hundred.avif
    image_srcset: horsey-hundred-p-500.avif 500w, horsey-hundred.avif 1200w
    image_alt: Anthony Brown riding away from the camera at the Horsey Hundred in a Kentucky Cycling Challenge jersey
    image_w: 1200
    image_h: 900
    # image:      # TODO: needs a photo confirmed as being from this ride
    # image_alt:

  - name: Redbud Ride
    meta: "2026 • Kentucky"
    body:
      - First KCC ride I documented for DaPenguin.
      - Plenty of miles. Plenty of camera footage. Apparently riding the bike wasn't enough work.
    image: IMG_0712.webp
    image_srcset: IMG_0712-p-500.webp 500w, IMG_0712.webp 640w
    image_alt: Anthony Brown riding through the finish arch at the Redbud Ride in London, Kentucky
    image_w: 640
    image_h: 480

  - name: Jamaica
    meta: "April 2026 • Jamaica"
    body:
      - First international cycling trip.
      - Also the first time I'd been outside the United States without the Marine Corps being responsible for the itinerary.
      - Different experience.
      - I'd go back.
    image: IMG_7776.avif
    image_srcset: IMG_7776-p-500.avif 500w, IMG_7776.avif 640w
    image_alt: Anthony Brown with his finisher's medal in front of a Cycle Jamaica backdrop
    image_position: center top
    image_w: 480
    image_h: 640
