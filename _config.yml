# DaPenguin — Anthony Brown cycling site
# Built by GitHub Pages (legacy Jekyll build) from the `main` branch, root path.

title: DaPenguin
author: Anthony Brown
description: >-
  Follow Anthony Brown, aka DaPenguin, through training rides, cycling events,
  gear, travel, and the miles in between.

url: "https://dapenguincycling.com"

# Served from the domain root, so no path prefix.
# Every internal link goes through the `relative_url` filter, so this one value
# is all that needs to change if the site ever moves back to a subpath
# (e.g. "/keep-riding" for the github.io project URL).
baseurl: ""

# ---------------------------------------------------------------------------
# Real, verified destinations. Single source of truth for nav, footer, contact.
#
# Leave a value blank and every link to it disappears from the site instead of
# rendering as a dead link. Paste a real URL in and it lights up everywhere.
# Do not fill these in with guesses.
# ---------------------------------------------------------------------------
contact:
  email: "anthonybrown7557@gmail.com"
  # The old site printed this number but linked it to "#", so it was visible and
  # not clickable — the worst of both. Now the number lives only in the href and
  # the page shows `whatsapp_label` instead.
  #
  # Caveat worth knowing: a wa.me URL still contains the digits, so the number is
  # in the page source even though it is not displayed. That stops casual
  # copying, not a scraper. To keep it out of the source entirely, replace
  # whatsapp_url with a free WhatsApp Business short link (wa.link/xxxxx), which
  # resolves to the number without revealing it. Nothing else needs to change.
  whatsapp_url: "https://wa.me/12535762262"
  whatsapp_label: "Message on WhatsApp"

social:
  facebook: "https://www.facebook.com/profile.php?id=61567605682416"
  # Strava: normally left blank. The daily mileage Action records the athlete's
  # public profile URL in _data/stats.json, and the site falls back to that, so
  # the link appears on its own after the next run. Set a value here only to
  # override it (e.g. a vanity URL).
  strava: ""

forms:
  # The old markup was a Webflow form. Webflow forms only collect submissions on
  # Webflow hosting — on GitHub Pages they post nowhere, so that form was a dead
  # control. Paste a form-handler endpoint here (Formspree, Basin, Getform, etc.)
  # and the contact form renders and works. While this is blank the contact page
  # leads with the real email address instead of showing a button that does nothing.
  endpoint: "https://script.google.com/macros/s/AKfycbxnR44JeS5awVY5p_BlizC1AZl6gObOr80ZDQ_m0jfOzKDibq8V9j6zKzUg6bQxxpTS1Q/exec"

sponsor:
  bluedobie: "https://www.bluedobiedev.com"

# jekyll-sitemap generates /sitemap.xml (and a /robots.txt pointing at it) from
# the pages that already exist — nothing to maintain by hand, and a new page is
# listed the moment it is added. It ships inside the `github-pages` gem and is on
# the GitHub Pages plugin allowlist, so it needs no Gemfile change and runs on
# the Pages build the same as it does locally.
#
# It builds the URLs from `url` above, which is the apex domain. That matters:
# www.dapenguincycling.com 301-redirects to the apex, so the apex is canonical
# and the sitemap must agree with it. Change one and change the other.
#
# Add `sitemap: false` to a page's front matter to keep it out.
plugins:
  - jekyll-sitemap

# The Google Search Console verification file is a static file, and jekyll-sitemap
# lists static .html files alongside real pages — so it would appear in the
# sitemap as if it were a page. Setting `sitemap: false` through `defaults`
# rather than front matter is what keeps it out: Google requires that file's
# contents to be exactly the one line it generated, and front matter would make
# Jekyll render the file instead of copying it through untouched.
#
# If the property is ever re-verified, Google issues a new filename — swap it
# here and in the repo root together, and leave the old one in place if other
# Google products still check for it.
defaults:
  - scope:
      path: "google07042a99acd862f5.html"
    values:
      sitemap: false

analytics:
  # Google Analytics 4 measurement ID for the "DaPenguin stream" web stream
  # (stream ID 15846120289, https://www.dapenguincycling.com).
  #
  # Blank this out and the tag disappears from every page. It is also skipped
  # automatically in a development build, so `bundle exec jekyll serve` never
  # sends hits to the property.
  ga4_measurement_id: "G-XMHYECRX6B"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - README.md
  - CLAUDE.md
